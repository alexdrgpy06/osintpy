services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - mongodb
      - neo4j
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  mongodb:
    image: mongodb/mongodb-community-server:latest
    ports:
      - "27017:27017"

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  worker:
    build: ./backend
    command: celery -A services.task_manager.celery_app worker --loglevel=info
    depends_on:
      - redis
      - mongodb
